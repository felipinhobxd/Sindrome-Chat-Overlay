version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      android-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # These AndroidX AAR versions require compileSdk 36/37, but the project
      # compiles against SDK 35, the maximum recommended for AGP 8.8.2.
      # Remove these rules when the project migrates to a newer
      # AGP/compileSdk.
      - dependency-name: "androidx.core:core"
        versions: [">=1.16"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.16"]
      - dependency-name: "androidx.appcompat:appcompat"
        versions: [">=1.8"]
      - dependency-name: "com.google.android.material:material"
        versions: [">=1.13"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      actions-updates:
        patterns:
          - "*"
