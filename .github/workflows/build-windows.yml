name: Build Windows release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-build.lock.txt

      - name: Read project version
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          if ($content -notmatch '(?m)^version = "([^"]+)"') {
            throw "Version not found in pyproject.toml"
          }
          $version = $Matches[1]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-build.lock.txt

      - name: Run unit and Windows UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Generate build assets
        run: |
          python tools/create_icon.py
          python tools/create_sound.py

      - name: Verify PyInstaller packaging
        run: python -m PyInstaller --noconfirm --clean SindromeChatOverlay.spec

      - name: Include installer documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist/LICENSE.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify Windows installer packaging
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "/DAppVersion=$env:VERSION" installer/SindromeChatOverlay.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $setup = "release/SindromeChatOverlay-Setup-v$env:VERSION.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer was not produced at $setup"
          }

  release-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "Version not found in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish only a new version tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; this main merge is not a new release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $RELEASE_TAG is new and may be published after provenance verification."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require merged pull request provenance
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=0
          for attempt in 1 2 3 4 5 6; do
            count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
            if [ "$count" -ge 1 ]; then
              echo "Verified merged pull request provenance on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Pull request association is not indexed yet; retrying in 5 seconds ($attempt/6)..."
              sleep 5
            fi
          done
          echo "Refusing to publish: $GITHUB_SHA is not associated with a merged pull request into main after retries." >&2
          exit 1

  build:
    needs: release-gate
    if: >-
      github.event_name != 'pull_request' &&
      needs.release-gate.result == 'success' &&
      needs.release-gate.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-gate.outputs.version }}
      RELEASE_TAG: ${{ needs.release-gate.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-build.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-build.lock.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Generate application icon
        run: python tools/create_icon.py

      - name: Generate notification sounds
        run: python tools/create_sound.py

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean SindromeChatOverlay.spec

      - name: Include documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist/LICENSE.txt

      - name: Build portable archive
        shell: pwsh
        run: |
          $zip = "SindromeChatOverlay-Windows-v$env:VERSION.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "/DAppVersion=$env:VERSION" installer/SindromeChatOverlay.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $zip = "SindromeChatOverlay-Windows-v$env:VERSION.zip"
          $setup = "release/SindromeChatOverlay-Setup-v$env:VERSION.exe"
          $files = @(
            "dist/SindromeChatOverlay.exe",
            $zip,
            $setup
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Refuse to overwrite an existing release tag
        shell: pwsh
        run: |
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify whether release tag $env:RELEASE_TAG already exists."
          }
          if ($existingTag) {
            throw "Release tag $env:RELEASE_TAG appeared while this build was running; refusing to overwrite it."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SindromeChatOverlay-Windows-v${{ env.VERSION }}
          path: |
            dist/*
            release/SindromeChatOverlay-Setup-v${{ env.VERSION }}.exe
            SindromeChatOverlay-Windows-v${{ env.VERSION }}.zip
            SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $version = $env:VERSION
          $pattern = "(?ms)^## \[" + [regex]::Escape($version) + "\]\s*-.*?\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
            throw "CHANGELOG.md has no '## [$version]' section with notes; add release notes before publishing."
          }
          $notes = $match.Groups[1].Value.Trim() + "`n`n**Recommended:** download ``SindromeChatOverlay-Setup-v$version.exe`` for a standard Windows installation with shortcuts and an uninstaller. Portable builds are also available as a standalone ``.exe`` and a ``.zip`` archive."
          Set-Content release_notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sindrome Chat Overlay ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: release_notes.md
          files: |
            release/SindromeChatOverlay-Setup-v${{ env.VERSION }}.exe
            dist/SindromeChatOverlay.exe
            SindromeChatOverlay-Windows-v${{ env.VERSION }}.zip
            SHA256SUMS.txt
