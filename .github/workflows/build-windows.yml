name: Build Windows release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit and Windows UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Generate build assets
        run: |
          python tools/create_icon.py
          python tools/create_sound.py

      - name: Verify PyInstaller packaging
        run: python -m PyInstaller --noconfirm --clean SindromeChatOverlay.spec

  build:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: production-signing
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $required = @{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            AZURE_ARTIFACT_SIGNING_ENDPOINT = $env:SIGNING_ENDPOINT
            AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME = $env:SIGNING_ACCOUNT
            AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE = $env:SIGNING_PROFILE
          }
          $missing = @($required.Keys | Where-Object {
            [string]::IsNullOrWhiteSpace($required[$_])
          })
          if ($missing.Count -gt 0) {
            throw "Signed release blocked. Configure the production-signing environment values: $($missing -join ', ')."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read project version
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          if ($content -notmatch '(?m)^version = "([^"]+)"') {
            throw "Version not found in pyproject.toml"
          }
          $version = $Matches[1]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Generate application icon
        run: python tools/create_icon.py

      - name: Generate message sound
        run: python tools/create_sound.py

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean SindromeChatOverlay.spec

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign portable executable with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\SindromeChatOverlay.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Sindrome Chat Overlay
          description-url: https://github.com/felipinhobxd/Sindrome-Chat-Overlay

      - name: Include documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist/LICENSE.txt

      - name: Build portable archive
        shell: pwsh
        run: |
          $zip = "SindromeChatOverlay-Windows-v$env:VERSION.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "/DAppVersion=$env:VERSION" installer/SindromeChatOverlay.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Sign Windows installer with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\release\SindromeChatOverlay-Setup-v${{ env.VERSION }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Sindrome Chat Overlay Installer
          description-url: https://github.com/felipinhobxd/Sindrome-Chat-Overlay

      - name: Verify Authenticode signatures and publisher continuity
        shell: pwsh
        run: |
          $files = @(
            "dist/SindromeChatOverlay.exe",
            "release/SindromeChatOverlay-Setup-v$env:VERSION.exe"
          )
          $expectedSubject = $null
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Signed release blocked: $file has Authenticode status $($signature.Status)."
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Signed release blocked: $file has no signer certificate."
            }
            $subject = [string]$signature.SignerCertificate.Subject
            if ([string]::IsNullOrWhiteSpace($subject)) {
              throw "Signed release blocked: $file has no signer subject."
            }
            if ($null -eq $expectedSubject) {
              $expectedSubject = $subject
            } elseif ($subject -cne $expectedSubject) {
              throw "Signed release blocked: application and installer publishers differ."
            }
          }
          Write-Host "Authenticode verification passed for $($files.Count) release files."

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $zip = "SindromeChatOverlay-Windows-v$env:VERSION.zip"
          $setup = "release/SindromeChatOverlay-Setup-v$env:VERSION.exe"
          $files = @(
            "dist/SindromeChatOverlay.exe",
            $zip,
            $setup
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SindromeChatOverlay-Windows-v${{ env.VERSION }}
          path: |
            dist/*
            release/SindromeChatOverlay-Setup-v${{ env.VERSION }}.exe
            SindromeChatOverlay-Windows-v${{ env.VERSION }}.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sindrome Chat Overlay ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Sindrome Chat Overlay combines Twitch and YouTube live chat in one transparent Windows overlay.

            The interface starts in English and can be changed to Brazilian Portuguese under Settings → Language. Automatic scrolling and message sounds are enabled by default.

            YouTube setup is now simpler: the main screen shows only the channel/live link and the real connection mode. The optional Data API key lives in Advanced settings, stays masked, is validated without blocking the UI, and distinguishes invalid credentials from temporary network or quota failures.

            Chat messages now use a cleaner game-HUD layout: metadata stays transparent, only the text/emote content receives a compact dark background, spacing is tighter, and a discreet `⋮⋮` handle makes the draggable header obvious even at 0% panel opacity.

            Windows executables are signed and timestamped through Azure Artifact Signing. The in-app updater downloads the installer in the background, validates the exact release asset URL, size, SHA-256 checksum, trusted Authenticode signature, and publisher continuity, then asks before running it. It never executes an unverified update silently.

            The existing official `liveChatMessages.streamList`, automatic live discovery, compatibility mode, DPAPI protection, Twitch emotes, badges, and individual username colours are preserved.

            **Recommended:** download `SindromeChatOverlay-Setup-v${{ env.VERSION }}.exe` for a standard Windows installation with shortcuts and an uninstaller.

            Portable builds are also available as a standalone `.exe` and a `.zip` archive.
          files: |
            release/SindromeChatOverlay-Setup-v${{ env.VERSION }}.exe
            dist/SindromeChatOverlay.exe
            SindromeChatOverlay-Windows-v${{ env.VERSION }}.zip
            SHA256SUMS.txt
