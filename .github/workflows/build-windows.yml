name: Gerar EXE e Release do Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ler versao do projeto
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          if ($content -notmatch '(?m)^version = "([^"]+)"') {
            throw "Versao nao encontrada em pyproject.toml"
          }
          $version = $Matches[1]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Gerar icone
        run: python tools/create_icon.py

      - name: Gerar som de mensagem
        run: python tools/create_sound.py

      - name: Gerar EXE
        run: python -m PyInstaller --noconfirm --clean SindromeChatOverlay.spec

      - name: Incluir documentacao
        shell: pwsh
        run: |
          Copy-Item README.md dist/LEIA-ME.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist/LICENSE.txt

      - name: Preparar arquivos da versao
        shell: pwsh
        run: |
          $zip = "SindromeChatOverlay-Windows-v$env:VERSION.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          $exeHash = (Get-FileHash dist/SindromeChatOverlay.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  SindromeChatOverlay.exe"
            "$zipHash  $zip"
          ) | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: SindromeChatOverlay-Windows-v${{ env.VERSION }}
          path: |
            dist/*
            SindromeChatOverlay-Windows-v${{ env.VERSION }}.zip
            SHA256SUMS.txt

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sindrome Chat Overlay ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Overlay transparente para Windows que reúne mensagens ao vivo da Twitch e do YouTube.

            A rolagem automática e o som de novas mensagens vêm ativados por padrão e podem ser alterados em Configurações → Aparência.

            Baixe o `.exe` para executar diretamente ou o `.zip` portátil com a documentação completa.
          files: |
            dist/SindromeChatOverlay.exe
            SindromeChatOverlay-Windows-v${{ env.VERSION }}.zip
            SHA256SUMS.txt
