name: Build Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Windows release"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-android:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Read application version
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' android/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Android versionName was not found" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Run Android tests and lint
        run: gradle :android:testDebugUnitTest :android:lintDebug --stacktrace

      - name: Build installable debug APK
        run: gradle :android:assembleDebug --stacktrace

      - name: Upload tested debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SindromeChatOverlay-Android-debug-v${{ env.VERSION }}
          path: android/build/outputs/apk/debug/android-debug.apk

      - name: Check release-signing secrets
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured; only the tested debug artifact will be produced."
          fi

      - name: Restore private signing key
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sindrome-release.jks"
          chmod 600 "$RUNNER_TEMP/sindrome-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sindrome-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :android:assembleRelease --stacktrace

      - name: Verify and checksum signed APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          source_apk="android/build/outputs/apk/release/android-release.apk"
          release_apk="SindromeChatOverlay-Android-v$VERSION.apk"
          test -f "$source_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$source_apk"
          cp "$source_apk" "$release_apk"
          sha256sum "$release_apk" > SHA256SUMS-Android.txt

      - name: Upload signed Android artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SindromeChatOverlay-Android-v${{ env.VERSION }}
          path: |
            SindromeChatOverlay-Android-v${{ env.VERSION }}.apk
            SHA256SUMS-Android.txt

      - name: Attach signed APK to GitHub Release
        if: >-
          steps.signing.outputs.configured == 'true' &&
          github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sindrome Chat Overlay ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            SindromeChatOverlay-Android-v${{ env.VERSION }}.apk
            SHA256SUMS-Android.txt

