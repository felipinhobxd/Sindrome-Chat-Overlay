name: Build Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Windows release"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-android:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      publish: ${{ steps.release_target.outputs.publish }}
      signing_configured: ${{ steps.signing.outputs.configured }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.10.2"
          cache-provider: basic

      - name: Read application version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' android/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Android versionName was not found" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Run Android tests and lint
        run: gradle :android:testDebugUnitTest :android:lintDebug --stacktrace

      - name: Build installable debug APK
        run: gradle :android:assembleDebug --stacktrace

      - name: Upload tested debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SindromeChatOverlay-Android-debug-v${{ env.VERSION }}
          path: android/build/outputs/apk/debug/android-debug.apk

      - name: Verify release tag belongs to this commit
        if: github.event_name != 'pull_request'
        id: release_target
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}' | head -n 1)
          if [ -n "$tag_sha" ] && [ "$tag_sha" = "$TARGET_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG points to the workflow commit; signed Android assets may be attached."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release attachment: $RELEASE_TAG does not point to $TARGET_SHA."
          fi

      - name: Check release-signing secrets
        if: >-
          github.event_name != 'pull_request' &&
          steps.release_target.outputs.publish == 'true'
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured; only the tested debug artifact will be produced."
          fi

      - name: Restore private signing key
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sindrome-release.jks"
          chmod 600 "$RUNNER_TEMP/sindrome-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sindrome-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :android:assembleRelease --stacktrace

      - name: Verify and checksum signed APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          source_apk="android/build/outputs/apk/release/android-release.apk"
          release_apk="SindromeChatOverlay-Android-v$VERSION.apk"
          test -f "$source_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$source_apk"
          cp "$source_apk" "$release_apk"
          sha256sum "$release_apk" > SHA256SUMS-Android.txt

      - name: Upload signed Android artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SindromeChatOverlay-Android-v${{ env.VERSION }}
          path: |
            SindromeChatOverlay-Android-v${{ env.VERSION }}.apk
            SHA256SUMS-Android.txt

  publish-android:
    needs: build-android
    if: >-
      github.event_name != 'pull_request' &&
      needs.build-android.result == 'success' &&
      needs.build-android.outputs.publish == 'true' &&
      needs.build-android.outputs.signing_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SindromeChatOverlay-Android-v${{ needs.build-android.outputs.version }}
          path: release-android

      - name: Attach signed APK to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build-android.outputs.release_tag }}
          name: Sindrome Chat Overlay ${{ needs.build-android.outputs.release_tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-android/SindromeChatOverlay-Android-v${{ needs.build-android.outputs.version }}.apk
            release-android/SHA256SUMS-Android.txt
