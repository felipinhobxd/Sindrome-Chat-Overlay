name: Supply chain audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 11 * * 1"

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-build.lock.txt

      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit runtime lock
        run: python -m pip_audit --strict -r requirements.lock.txt

      - name: Audit build lock
        run: python -m pip_audit --strict -r requirements-build.lock.txt

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt

      - name: Install runtime deps (mypy needs real PySide6/requests stubs)
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Install mypy
        run: python -m pip install --disable-pip-version-check mypy==2.3.1 types-requests

      - name: Run mypy (config in pyproject.toml)
        run: python -m mypy

  android-osv-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.10.2"
          cache-provider: basic

      - name: Export resolved Android runtime dependencies
        run: gradle -I tools/export_android_runtime_dependencies.gradle :android:exportResolvedRuntimeModules --stacktrace

      - name: Audit declared and transitive Android dependencies against OSV
        run: python tools/audit_android_dependencies.py --resolved-file build/android-resolved-maven.txt
