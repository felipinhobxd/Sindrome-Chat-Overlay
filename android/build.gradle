plugins {
    id "com.android.application"
    id "com.google.protobuf"
}

def signingStore = System.getenv("ANDROID_KEYSTORE_PATH")
def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingAlias = System.getenv("ANDROID_KEY_ALIAS")
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = signingStore && signingStorePassword && signingAlias && signingKeyPassword

android {
    namespace "com.sindromegames.chatoverlay"
    compileSdk 35

    defaultConfig {
        applicationId "com.sindromegames.chatoverlay"
        minSdk 26
        targetSdk 35
        versionCode 192
        versionName "1.9.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Ship only the locales the app actually provides (values/ + values-pt-rBR/);
        // strips every other translation bundled by AndroidX/Material libraries.
        // (resourceConfigurations == localeFilters from AGP 9 onwards)
        resourceConfigurations.addAll("en", "pt-rBR")
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingStore)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds true
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.36.1"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.84.0"
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { option "lite" }
            }
            task.plugins {
                grpc { option "lite" }
            }
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.grpc:grpc-okhttp:1.84.0"
    implementation "io.grpc:grpc-protobuf-lite:1.84.0"
    implementation "io.grpc:grpc-stub:1.84.0"
    compileOnly "org.apache.tomcat:annotations-api:6.0.53"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.16.1"

    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
}
