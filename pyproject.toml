[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sindrome-chat-overlay"
version = "1.2.0"
description = "Transparent Windows overlay that combines Twitch and YouTube live chat."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sindrome Games" }]
dependencies = [
  "PySide6>=6.8,<7",
  "requests>=2.32,<3",
]

[project.scripts]
sindrome-chat-overlay = "sindrome_overlay.app:run"

[tool.setuptools.packages.find]
include = ["sindrome_overlay*"]

[tool.ruff]
line-length = 100
target-version = "py311"
